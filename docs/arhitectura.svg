<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="880" height="420" fill="#0e1117"/>

  <!-- Pi box -->
  <rect x="30" y="40" width="360" height="250" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="70" fill="#e6edf3" font-size="16" font-weight="600">Raspberry Pi Zero W (rulotă)</text>

  <rect x="50" y="88" width="320" height="46" rx="8" fill="#1f6feb22" stroke="#1f6feb"/>
  <text x="64" y="106" fill="#79c0ff" font-size="12" font-weight="600">DC-DC + MPPT</text>
  <text x="64" y="123" fill="#8b949e" font-size="11">RBC50D1S-G1 · panouri + alternator · BT-2</text>

  <rect x="50" y="142" width="320" height="42" rx="8" fill="#23863622" stroke="#238636"/>
  <text x="64" y="159" fill="#7ee787" font-size="12" font-weight="600">Baterie 1</text>
  <text x="64" y="175" fill="#8b949e" font-size="11">LiFePO4 · modul BT-2 · SOC din BMS</text>

  <rect x="50" y="192" width="320" height="42" rx="8" fill="#23863622" stroke="#238636"/>
  <text x="64" y="209" fill="#7ee787" font-size="12" font-weight="600">Baterie 2</text>
  <text x="64" y="225" fill="#8b949e" font-size="11">RBT12100LFP-BT · 100 Ah · self-heating</text>

  <text x="50" y="258" fill="#8b949e" font-size="11">BLE secvențial, un dispozitiv la un moment dat, ciclu de 60 s</text>
  <text x="50" y="276" fill="#8b949e" font-size="11">buffer SQLite offline → MQTT QoS1</text>

  <!-- arrow -->
  <path d="M392 190 L 470 190" stroke="#58a6ff" stroke-width="2" fill="none"/>
  <path d="M470 190 l -10 -5 l 0 10 z" fill="#58a6ff"/>
  <text x="398" y="180" fill="#58a6ff" font-size="11">Tailscale</text>
  <text x="398" y="212" fill="#8b949e" font-size="11">WireGuard</text>

  <!-- VPS box -->
  <rect x="486" y="40" width="364" height="250" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="506" y="70" fill="#e6edf3" font-size="16" font-weight="600">VPS (privat)</text>

  <rect x="506" y="88" width="324" height="34" rx="8" fill="#8957e522" stroke="#8957e5"/>
  <text x="520" y="110" fill="#d2a8ff" font-size="12">Mosquitto (doar în tailnet)</text>

  <rect x="506" y="128" width="324" height="34" rx="8" fill="#8957e522" stroke="#8957e5"/>
  <text x="520" y="150" fill="#d2a8ff" font-size="12">Telegraf → InfluxDB (52 săptămâni)</text>

  <rect x="506" y="168" width="324" height="34" rx="8" fill="#bf870022" stroke="#bf8700"/>
  <text x="520" y="190" fill="#e3b341" font-size="12">Grafana · dashboard + alerte</text>

  <rect x="506" y="208" width="156" height="34" rx="8" fill="#1f6feb22" stroke="#1f6feb"/>
  <text x="520" y="230" fill="#79c0ff" font-size="12">Bot Telegram</text>

  <rect x="674" y="208" width="156" height="34" rx="8" fill="#1f6feb22" stroke="#1f6feb"/>
  <text x="688" y="230" fill="#79c0ff" font-size="12">ntfy (push)</text>

  <text x="506" y="266" fill="#8b949e" font-size="11">https://&lt;nod&gt;.ts.net:10451 · :10452</text>

  <!-- bottom note -->
  <rect x="30" y="312" width="820" height="76" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="338" fill="#e6edf3" font-size="12" font-weight="600">Fără porturi publice</text>
  <text x="50" y="358" fill="#8b949e" font-size="11">MQTT ascultă doar pe IP-ul Tailscale; Grafana doar pe 127.0.0.1, publicată prin `tailscale serve`.</text>
  <text x="50" y="376" fill="#8b949e" font-size="11">Dashboard-ul și botul rămân accesibile doar dispozitivelor autentificate în tailnet.</text>
</svg>
