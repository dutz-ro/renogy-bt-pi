[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "$INFLUX_BUCKET"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["renogy/+/+/state"]
  qos = 1
  client_id = "renogy-telegraf"
  username = "$MQTT_USER"
  password = "$MQTT_PASSWORD"
  name_override = "renogy"
  data_format = "json"
  tag_keys = ["site_id", "device_id", "device_kind"]
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05.999999Z07:00"
